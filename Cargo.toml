[package]
name = "glassbox"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
eframe = "0.33.0"
egui = "0.33.0"
env_logger = "0.11.8"
log = "0.4.28"
raw-window-handle = "0.6.2"
rfd = "0.15.4"
taglib = "1.0.0"

[dependencies.windows]
version = ">=0.59, <=0.62"
features = [
    "Data_Xml_Dom",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[patch.crates-io]
taglib = { git = "https://github.com/yourname3/taglib-rust.git" }